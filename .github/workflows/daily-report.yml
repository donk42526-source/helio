name: Daily US Stock Report
on:
  schedule: [{cron: '30 11 * * 1-5'}]
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r us-stock-daily/requirements.txt
      - run: cd us-stock-daily && python daily.py
      - uses: peaceiris/actions-gh-pages@v3
        with: {github_token: '${{ secrets.GITHUB_TOKEN }}', publish_dir: ./output, destination_dir: daily, keep_files: true}
